<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSH Ledger — စာရင်း</title>
<style>
:root{--bg:#eef2f7;--card:#ffffff;--pri:#2563eb;--pri-d:#1d4ed8;--ok:#16a34a;--ok-d:#15803d;--bad:#dc2626;--bad-d:#b91c1c;--txt:#1e293b;--muted:#64748b;--line:#e2e8f0;--head:#1e3a8a;--head2:#3b82f6;--zebra:#f8fafc;--total:#fff7ed;--total-b:#fdba74;--shadow:0 1px 3px rgba(15,23,42,.08),0 8px 22px rgba(15,23,42,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Myanmar",system-ui,sans-serif;color:var(--txt);padding:16px;font-size:14px;min-height:100vh;
  background:radial-gradient(1200px 600px at 100% -10%,#e0eaff 0,transparent 60%),radial-gradient(900px 520px at -10% 0,#eaf1ff 0,transparent 55%),var(--bg)}
h1{font-size:20px;margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:.2px}
h1::before{content:"";width:10px;height:26px;border-radius:6px;background:linear-gradient(180deg,var(--head2),var(--head));display:inline-block}
/* Tabs — segmented control */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;background:#fff;padding:6px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);align-items:center}
.tabs button{padding:9px 16px;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:.18s ease}
.tabs button:hover{background:#f1f5f9;color:var(--txt)}
.tabs button.active{background:linear-gradient(180deg,var(--head2),var(--pri));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.tabs button.lang-toggle{margin-left:auto;background:#eef2f7;color:var(--txt);border:1px solid var(--line);font-weight:600}
.tabs button.lang-toggle:hover{background:#e2e8f0}
/* Cards */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto;border:1px solid var(--line)}
/* Tables */
table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:linear-gradient(180deg,var(--head2),var(--head));color:#fff;font-size:12px;font-weight:700;position:sticky;top:0;z-index:2;letter-spacing:.3px}
th:first-child{border-top-left-radius:12px}
th:last-child{border-top-right-radius:12px}
td:first-child,th:first-child{text-align:left}
tbody tr:nth-child(even):not(.total-row){background:var(--zebra)}
tbody tr:hover:not(.total-row){background:#eff6ff}
.total-row td{font-weight:800;background:var(--total);border-top:2px solid var(--total-b)}
.total-row td:first-child{border-bottom-left-radius:12px}
.total-row td:last-child{border-bottom-right-radius:12px}
.neg{color:var(--bad)}
/* Inputs */
input{width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right;font-size:13px;background:#fff;transition:.15s}
input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
input.name{width:150px;text-align:left}
select,input[type=date],input[type=month],input[type=number],input[type=text]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;transition:.15s}
input[type=date],input[type=month]{width:auto;min-width:150px}
select:focus,input[type=date]:focus,input[type=month]:focus,input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
/* Buttons */
.btn{padding:8px 14px;border:none;border-radius:9px;background:var(--pri);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(37,99,235,.25)}
.btn:hover{background:var(--pri-d);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-ok{background:var(--ok);box-shadow:0 2px 6px rgba(22,163,74,.25)}
.btn-ok:hover{background:var(--ok-d)}
.btn-del{background:var(--bad);padding:4px 10px;font-size:12px;box-shadow:0 2px 6px rgba(220,38,38,.25)}
.btn-del:hover{background:var(--bad-d)}
/* Misc */
.small{font-size:12px;color:var(--muted);line-height:1.5}
.cname{cursor:pointer;color:var(--pri);font-weight:700}
.cname:hover{text-decoration:underline;color:var(--pri-d)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#account-card input[type=email],#account-card input[type=password]{width:100%}
.acc-col{display:flex;flex-direction:column;gap:8px;max-width:330px;margin-top:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50}
@media(max-width:640px){input{width:74px}.tabs{font-size:12px}.tabs button{padding:8px 12px}}
</style>
</head>
<body>
<h1>📊 KSH Ledger</h1>
<div class="tabs">
  <button data-t="day" class="active" data-i18n="tab_day">နေ့စဉ်</button>
  <button data-t="month" data-i18n="tab_month">လစဉ်</button>
  <button data-t="customer" data-i18n="tab_customer_view">Customer ကြည့်ရန်</button>
  <button data-t="all" data-i18n="tab_all">စုစုပေါင်း</button>
  <button data-t="cust" data-i18n="tab_customer_manage">Customer စီမံ</button>
  <button data-t="account" data-i18n="tab_account">အကောင့်</button>
  <button id="lang-toggle" class="lang-toggle" data-i18n="lang_toggle">English</button>
</div>

<div id="v-day" class="view">
  <div class="card">
    <div class="bar">
      <input type="date" id="d-date">
      <span class="small" id="d-info"></span>
    </div>
    <table id="d-table"></table>
    <p class="small" style="margin-top:6px" data-i18n="day_note">Amount = Viss × Price (auto) · Credit = ဖောက်သည်ထံမှ ရငွေ (ပေးငွေ) — ကျန်ငွေကို လျှော့သည် · Opening = ယခင် လက်ကျန် · Discount = ၁ပိဿာလျှင် လျှော့မည့် ငွေ</p>
  </div>
</div>

<div id="v-month" class="view" style="display:none">
  <div class="card">
    <div class="bar"><input type="month" id="m-month"><span class="small" id="m-info"></span></div>
    <table id="m-table"></table>
  </div>
</div>

<div id="v-customer" class="view" style="display:none">
  <div class="card">
    <div class="bar"><select id="customer-select"></select><input type="month" id="customer-month"><span class="small" id="customer-info"></span></div>
    <table id="customer-table"></table>
  </div>
</div>

<div id="v-all" class="view" style="display:none">
  <div class="card">
    <div class="bar"><button class="btn" id="a-refresh" data-i18n="btn_refresh">ပြန်တွက်</button><span class="small" data-i18n="all_note">Opening + ရောင်းရငွေ − Credit − (Viss × Discount) = ကျန်ငွေ</span></div>
    <table id="a-table"></table>
  </div>
</div>

<div id="v-cust" class="view" style="display:none">
  <div class="card">
    <div class="bar">
      <input type="text" id="c-new" placeholder="Customer အမည်" style="width:180px" data-i18n-ph="ph_name">
      <button class="btn" id="c-add" data-i18n="btn_add">+ ထည့်</button>
      <button class="btn btn-ok" id="c-export" data-i18n="btn_backup">Backup ဒေါင်းလုဒ်</button>
      <label class="btn" style="background:#64748b"><span data-i18n="btn_import">Import JSON</span><input type="file" id="c-import" accept=".json" hidden></label>
      <button class="btn btn-del" id="c-delall" data-i18n="btn_delall">🗑 စာရင်းအာလုံးကိုဖြတ်မည်</button>
    </div>
    <table id="c-table"></table>
  </div>
</div>

<div id="v-account" class="view" style="display:none"><div class="card" id="account-card"></div></div>
<div id="toast"></div>

function monthsOf(c){ return [...new Set((c.entries||[]).map(e=>e.date.slice(0,7)))].sort(); }
function openingAtMonth(c, m){
  let bal = Number(c.opening)||0;
  for(const mm of monthsOf(c)){ if(mm < m){
    const es=(c.entries||[]).filter(e=>e.date.startsWith(mm));
    bal = bal + es.reduce((t,e)=>t+(e.amount||0),0) - es.reduce((t,e)=>t+(e.credit||0),0) - es.reduce((t,e)=>t+(e.viss||0),0)*(c.discount||0);
  }}
  return bal;
}

/* ---------- DAY ---------- */
function dayTable(){
  const d = document.getElementById("d-date").value;
  const rows = [`<tr><th>${tr("col_customer")}</th><th>${tr("col_bird")}</th><th>${tr("col_viss")}</th><th>${tr("col_price")}</th><th>${tr("col_amount")}</th><th>${tr("col_credit")}</th><th></th></tr>`];
  let tA=0, tC=0, tB=0, tV=0;
  DB.customers.forEach((c,ci)=>{
    const e = c.entries.find(x=>x.date===d) || {};
    tA += e.amount||0; tC += e.credit||0; tB += e.bird||0; tV += e.viss||0;
    rows.push(`<tr data-ci="${ci}"><td class="cname" title="${tr("title_detail")}">${esc(c.name)}</td>`+
      ["bird","viss","price","amount","credit"].map(k=>`<td><input data-k="${k}" type="number" step="any" value="${e[k]??""}"></td>`).join("")+
      `<td><button class="btn btn-ok" data-del="${ci}">✕</button></td></tr>`);
  });
  rows.push(`<tr class="total-row"><td>${tr("lbl_total")}</td><td>${exact(tB)}</td><td>${exact(tV)}</td><td></td><td>${fmt(tA)}</td><td>${fmt(tC)}</td><td></td></tr>`);
  const t = document.getElementById("d-table");
  t.innerHTML = rows.join("");
  t.querySelectorAll("input").forEach(inp=>inp.addEventListener("change", ev=>{
    const ci = +ev.target.closest("tr").dataset.ci, k = inp.dataset.k;
    const c = DB.customers[ci];
    let e = c.entries.find(x=>x.date===d);
    if(!e){ e={date:d,bird:0,viss:0,price:0,amount:0,credit:0}; c.entries.push(e); }
    e[k] = parseFloat(inp.value)||0;
    if(k==="viss"||k==="price"){ e.amount = +((e.viss||0)*(e.price||0)).toFixed(2); }
    persist(); toast(tr("toast_saved")); sumDay(d);
    const row = ev.target.closest("tr");
    row.querySelectorAll("input").forEach(i2=>{ if(i2.dataset.k==="amount") i2.value = e.amount||""; });
  }));
  t.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", ()=>{
    const ci=+b.dataset.del;
    if(confirm(`"${DB.customers[ci].name}" ရက်စွဲ ${d} တွင်ရဲ့ data ဖျက်မလား?`)){
      DB.customers[ci].entries = DB.customers[ci].entries.filter(x=>x.date!==d);
      saved2(); dayTable();
    }
  }));
  sumDay(d);
}
function saved2(){ persist(); toast(tr("toast_deleted_row")); }
function sumDay(d){
  let a=0,cr=0,n=0,tB=0,tV=0;
  DB.customers.forEach(c=>{ const e=c.entries.find(x=>x.date===d); if(e&&(e.amount||e.credit||e.bird||e.viss)){a+=e.amount||0;cr+=e.credit||0;tB+=e.bird||0;tV+=e.viss||0;n++;} });
  document.getElementById("d-info").textContent = tr("info_day", n, a, cr);
  // bottom total row ကိုလည်း ပြန်တွက်
  const trow = document.querySelector("#d-table .total-row");
  if(trow){
    const tds = trow.querySelectorAll("td");
    // [0]=label [1]=bird [2]=viss [3]=price [4]=amount [5]=credit [6]=btn
    if(tds.length>=6){ tds[1].textContent=exact(tB); tds[2].textContent=exact(tV); tds[4].textContent=fmt(a); tds[5].textContent=fmt(cr); }
  }
}

/* ---------- MONTH ---------- */
function renderMonth(){
  const mv = document.getElementById("m-month").value;
  const rows=[`<tr><th>${tr("col_customer")}</th><th>${tr("col_opening")}</th><th>${tr("col_bird")}</th><th>${tr("col_viss")}</th><th>${tr("col_amount")}</th><th>${tr("col_credit")}</th><th>${tr("col_discount")}</th><th>${tr("col_balance")}</th></tr>`];
  let tO=0,tB=0,tV=0,tA=0,tC=0,tD=0,tBal=0;
  DB.customers.forEach((c,ci)=>{
    const es=c.entries.filter(e=>mv && e.date.startsWith(mv));
    if(!es.length) return;
    const s=k=>es.reduce((t,e)=>t+(e[k]||0),0);
    const b=s("bird"),v=s("viss"),a=s("amount"),cr=s("credit");
    const o=openingAtMonth(c,mv);
    const disc=v*(c.discount||0);
    const bal=o+a-cr-disc;
    tO+=o;tB+=b;tV+=v;tA+=a;tC+=cr;tD+=disc;tBal+=bal;
    rows.push(`<tr data-ci="${ci}"><td class="cname" title="${tr("title_detail")}">${esc(c.name)}</td><td>${fmt(o)}</td><td>${fmt(b)}</td><td>${fmt(v)}</td><td>${fmt(a)}</td><td>${fmt(cr)}</td><td>${fmt(disc)}</td><td class="${bal<0?'neg':''}">${fmt(bal)}</td></tr>`);
  });
  if(tA||tC||tD){
    rows.push(`<tr class="total-row"><td>${tr("lbl_total")}</td><td>${fmt(tO)}</td><td>${exact(tB)}</td><td>${exact(tV)}</td><td>${fmt(tA)}</td><td>${fmt(tC)}</td><td>${fmt(tD)}</td><td>${fmt(tBal)}</td></tr>`);
  }
  document.getElementById("m-table").innerHTML=rows.join("");
  document.getElementById("m-info").textContent = mv ? tr("info_month_for", mv) : tr("info_month_pick");
}

/* ---------- CUSTOMER DETAIL ---------- */
function customerOptions(){
  const s=document.getElementById("customer-select");
  const old=s.value;
  s.innerHTML=DB.customers.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join("");
  if(old && DB.customers[old]) s.value=old;
  customerTable();
}
function customerTable(){
  const i=+document.getElementById("customer-select").value||0, c=DB.customers[i];
  if(!c){document.getElementById("customer-table").innerHTML="";return;}
  const m=document.getElementById("customer-month").value;
  const es=c.entries.filter(e=>!m||e.date.startsWith(m));
  const o = m ? openingAtMonth(c,m) : (c.opening||0);
  let a=0,cr=0,b=0,v=0;
  const rows=[`<tr><th>${tr("col_date")}</th><th>${tr("col_opening")}</th><th>${tr("col_bird")}</th><th>${tr("col_viss")}</th><th>${tr("col_price")}</th><th>${tr("col_amount")}</th><th>${tr("col_credit")}</th><th>${tr("col_settled")}</th></tr>`];
  es.sort((x,y)=>y.date.localeCompare(x.date)).forEach(e=>{a+=e.amount||0;cr+=e.credit||0;b+=e.bird||0;v+=e.viss||0;rows.push(`<tr><td>${e.date}</td><td>${fmt(o)}</td><td>${exact(e.bird)}</td><td>${exact(e.viss)}</td><td>${exact(e.price)}</td><td>${exact(e.amount)}</td><td>${exact(e.credit)}</td><td>${fmt(e.amount-e.credit)}</td></tr>`)});
  const disc=v*(c.discount||0);
  const bal=o+a-cr-disc;
  rows.push(`<tr class="total-row"><td>${tr("lbl_total")}</td><td>${fmt(o)}</td><td>${exact(b)}</td><td>${exact(v)}</td><td></td><td>${exact(a)}</td><td>${exact(cr)}</td><td>${fmt(a-cr)}</td></tr>`);
  document.getElementById("customer-table").innerHTML=rows.join("");
  document.getElementById("customer-info").textContent=tr("info_customer", c, o, disc, bal);
}

/* ---------- ALL ---------- */
function allTable(){
  const rows=[`<tr><th>${tr("col_customer")}</th><th>${tr("col_opening")}</th><th>${tr("lbl_sales")}</th><th>${tr("col_credit")}</th><th>${tr("col_discount")}</th><th>${tr("col_balance")}</th></tr>`];
  let tO=0,tA=0,tCr=0,tD=0,tB=0;
  DB.customers.forEach((c,ci)=>{
    const a=c.entries.reduce((s,e)=>s+(e.amount||0),0);
    const cr=c.entries.reduce((s,e)=>s+(e.credit||0),0);
    const v=c.entries.reduce((s,e)=>s+(e.viss||0),0);
    const disc=v*(c.discount||0);
    const bal=(c.opening||0)+a-cr-disc;
    tO+=c.opening||0;tA+=a;tCr+=cr;tD+=disc;tB+=bal;
    rows.push(`<tr data-ci="${ci}"><td class="cname" title="${tr("title_detail")}">${esc(c.name)}</td><td>${fmt(c.opening||0)}</td><td>${fmt(a)}</td><td>${fmt(cr)}</td><td>${fmt(disc)}</td><td class="${bal<0?'neg':''}">${fmt(bal)}</td></tr>`);
  });
  rows.push(`<tr class="total-row"><td>${tr("lbl_total")}</td><td>${fmt(tO)}</td><td>${fmt(tA)}</td><td>${fmt(tCr)}</td><td>${fmt(tD)}</td><td>${fmt(tB)}</td></tr>`);

function showAccMsg(m){ const el=document.getElementById("acc-msg"); if(el) el.textContent=m; toast(m); }
function errMsg(e){ return (e&&e.message)?e.message:(e?e.toString():"Error"); }
function accSignIn(e,p){
  if(!auth) return showAccMsg(tr("acc_firebase_err"));
  if(!e||!p) return showAccMsg(tr("toast_name_req"));
  auth.signInWithEmailAndPassword(e,p).catch(err=>showAccMsg(errMsg(err)));
}
function accRegister(name,e,p,p2){
  if(!auth) return showAccMsg(tr("acc_firebase_err"));
  if(!name||!e||!p) return showAccMsg(tr("toast_name_req"));
  if(p!==p2) return showAccMsg(tr("acc_pass_mismatch"));
  if(p.length<6) return showAccMsg(tr("acc_weak_pass"));
  auth.createUserWithEmailAndPassword(e,p)
    .then(cred=>{ if(cred&&cred.user&&name) return cred.user.updateProfile({displayName:name}); })
    .then(()=>{ accPage="profile"; })
    .catch(err=>showAccMsg(errMsg(err)));
}
function accForgot(email){
  if(!auth) return showAccMsg(tr("acc_firebase_err"));
  if(!email) return showAccMsg(tr("acc_enter_email"));
  auth.sendPasswordResetEmail(email)
    .then(()=>showAccMsg(tr("acc_reset_sent")))
    .catch(err=>showAccMsg(errMsg(err)));
}
function accChangePassword(cur,neu,neu2){
  const u=auth&&auth.currentUser;
  if(!u) return showAccMsg(tr("acc_firebase_err"));
  if(!cur||!neu||!neu2) return showAccMsg(tr("toast_name_req"));
  if(neu!==neu2) return showAccMsg(tr("acc_pass_mismatch"));
  if(neu.length<6) return showAccMsg(tr("acc_weak_pass"));
  const cred=firebase.auth.EmailAuthProvider.credential(u.email,cur);
  u.reauthenticateWithCredential(cred)
    .then(()=>u.updatePassword(neu))
    .then(()=>{ showAccMsg(tr("acc_pass_changed")); accPage="profile"; renderAccount(u); })
    .catch(err=>showAccMsg(errMsg(err)));
}
function accGoogle(){
  if(!auth) return showAccMsg(tr("acc_firebase_err"));
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err=>showAccMsg(errMsg(err)));
}

/* ---------- CLOUD SYNC (Firestore) ---------- */
let saveTimer=null, cloudBusy=false, cloudState="";
function ledgerDoc(uid){ return fdb.collection("ledgers").doc(uid); }
function updateCloudStatus(){
  const el=document.getElementById("acc-cloud"); if(!el) return;
  if(!fdb) el.textContent=tr("acc_cloud_off");
  else if(cloudBusy||cloudState==="pending") el.textContent=tr("acc_cloud_saving");
  else if(cloudState==="error") el.textContent=tr("acc_cloud_err");
  else if(cloudState==="saved") el.textContent=tr("acc_cloud_saved");
  else el.textContent=tr("acc_cloud_ready");
}
function cloudSaveNow(){
  if(!fdb||!currentUser) return Promise.resolve();
  cloudBusy=true; updateCloudStatus();
  return ledgerDoc(currentUser.uid).set({customers:DB.customers||[],_v2:true,updatedAt:Date.now()})
    .then(()=>{ cloudBusy=false; cloudState="saved"; updateCloudStatus(); })
    .catch(e=>{ cloudBusy=false; cloudState="error"; updateCloudStatus(); console.error(e); });
}
function scheduleCloudSave(){
  if(!fdb||!currentUser) return;
  cloudState="pending"; updateCloudStatus();
  clearTimeout(saveTimer); saveTimer=setTimeout(cloudSaveNow, 900);
}
function cloudLoad(uid){
  return new Promise(resolve=>{
    if(!fdb){ resolve(false); return; }
    ledgerDoc(uid).get().then(snap=>{
      const d=snap.exists?snap.data():null;
      if(d && Array.isArray(d.customers)){
        DB={customers:d.customers,_v2:true};
        localStorage.setItem(KEY, JSON.stringify(DB)); // local cache (no cloud re-trigger)
        cloudState="saved"; resolve(true);
      } else {
        cloudSaveNow().then(()=>resolve(false)); // first sign-in: upload local/SEED data
      }
    }).catch(e=>{ console.error(e); cloudState="error"; updateCloudStatus(); resolve(false); });
  });
}

    if(user){
      // Anything typed as a guest is carried over, so it is not lost on the first sign-in.
      const guestDB = (KEY==="ksh-ledger-v1-guest") ? DB : null;
      KEY="ksh-ledger-v1-"+user.uid;
      const alreadySaved = !!localStorage.getItem(KEY);
      load();
      if(!alreadySaved && guestDB && guestDB.customers && guestDB.customers.length) DB=guestDB;
      accPage="profile"; renderAll(); showApp(); renderAccount(user);
      cloudLoad(user.uid).then(()=>{ renderAll(); renderAccount(user); });
    }
    else { KEY="ksh-ledger-v1-guest"; accPage="login"; load(); renderAll(); showApp(); renderAccount(null); }
  });
} else {
  KEY="ksh-ledger-v1-guest"; load(); renderAll(); showApp(); renderAccount(null);
  const c=document.getElementById("account-card"); if(c) c.innerHTML+='<p class="small">'+tr("acc_firebase_err")+'</p>';
}
document.getElementById("lang-toggle").addEventListener("click", ()=>{
  LANG = (LANG==="my") ? "en" : "my";
  localStorage.setItem(KEY_LANG, LANG);
  applyLang();
  dayTable(); renderMonth(document.getElementById("m-month").value); allTable(); custTable();
  if(document.querySelector('.tabs button[data-t="customer"]').classList.contains("active")) customerTable();
  renderAccount(currentUser);
});
</script>
</body>
</html>
